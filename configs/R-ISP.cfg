! ===== R-ISP: mô phỏng nhà mạng và Internet =====
hostname R-ISP
no ip domain-lookup
!
interface Loopback0
 description Gia lap may chu Internet / DNS cong cong
 ip address 8.8.8.8 255.255.255.255
!
interface GigabitEthernet0/0
 description Ket noi toi R1-EDGE
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
! Khong can route ve mang noi bo: R1 da NAT moi thu thanh 203.0.113.2
end
