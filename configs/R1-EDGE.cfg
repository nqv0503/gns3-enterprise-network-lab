! ===== R1-EDGE: router biên, NAT ra Internet, phát default route vào OSPF =====
hostname R1-EDGE
no ip domain-lookup
!
interface GigabitEthernet0/0
 description WAN - toi R-ISP
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 description Toi R2-HQ
 ip address 10.0.12.1 255.255.255.252
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/2
 description Toi R3-BRANCH
 ip address 10.0.13.1 255.255.255.252
 ip nat inside
 no shutdown
!
! --- NAT overload (PAT): moi mang 192.168.x.x ra Internet bang 1 IP public
ip access-list standard NAT-INSIDE
 permit 192.168.0.0 0.0.255.255
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/0 overload
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
router ospf 1
 router-id 1.1.1.1
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.13.0 0.0.0.3 area 0
 default-information originate
!
end
