! ===== R2-HQ: trụ sở chính - router-on-a-stick, DHCP, ACL =====
hostname R2-HQ
no ip domain-lookup
!
interface GigabitEthernet0/0
 description Toi R1-EDGE
 ip address 10.0.12.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description Duong du phong toi R3-BRANCH
 ip address 10.0.23.1 255.255.255.252
 no shutdown
!
! --- Router-on-a-stick: 1 cong vat ly, moi VLAN 1 subinterface (802.1Q)
interface GigabitEthernet0/1
 description Trunk toi SW1
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.10
 description VLAN 10 - SALES
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
!
interface GigabitEthernet0/1.20
 description VLAN 20 - IT
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
!
interface GigabitEthernet0/1.30
 description VLAN 30 - GUEST
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip access-group GUEST-IN in
!
interface GigabitEthernet0/1.99
 description VLAN 99 - MANAGEMENT
 encapsulation dot1Q 99
 ip address 192.168.99.1 255.255.255.0
 ip access-group MGMT-OUT out
!
! --- DHCP: chua 10 dia chi dau cho gateway, may chu, may in
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.20.1 192.168.20.10
ip dhcp excluded-address 192.168.30.1 192.168.30.10
!
ip dhcp pool VLAN10-SALES
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 8.8.8.8
!
ip dhcp pool VLAN20-IT
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 8.8.8.8
!
ip dhcp pool VLAN30-GUEST
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 8.8.8.8
 lease 0 4
!
! --- ACL 1: Khach chi duoc ra Internet, khong vao bat ky mang noi bo nao
ip access-list extended GUEST-IN
 remark Cho phep xin DHCP
 permit udp any any eq bootps
 remark Chan moi mang noi bo
 deny   ip 192.168.30.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny   ip 192.168.30.0 0.0.0.255 192.168.0.0 0.0.255.255
 remark Con lai (Internet) cho qua
 permit ip 192.168.30.0 0.0.0.255 any
!
! --- ACL 2: Chi phong IT duoc truy cap mang quan tri thiet bi
ip access-list extended MGMT-OUT
 permit ip 192.168.20.0 0.0.0.255 192.168.99.0 0.0.0.255
 deny   ip any any
!
router ospf 1
 router-id 2.2.2.2
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/2
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.23.0 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.99.0 0.0.0.255 area 0
!
end
